[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heterogeneous-llm-parallelism"
version = "0.1.0"
description = "Public-safe reconstruction of heterogeneous pipeline-parallel topology and configuration search"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
